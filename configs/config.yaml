defaults:
  - _self_
  - /callbacks: [checkpoint_every_n_steps, learning_rate_monitor]
  - /data: openwebtext-split
  - /model: small
  - /strategy: ddp
  - /noise: log-linear
  - /lr_scheduler: constant_warmup
  - /prior: none
  - /algo: mdlm
  - /logger: tensorboard

mode: train  # train / ppl_eval / sample_eval
debug: False
seed: 1

mmd:
  feature_layer: 3
  kernel: token_rbf
  rbf_alpha: 2e-5  # exp(-alpha * squared_distance)
  group_size: 4
  draws_per_candidate: 2
  average_candidates: True
  exclude_same_position: True
  kernel_block_size: 0
  feature_batch_size: 8

loader:
  global_batch_size: 512
  eval_global_batch_size: ${.global_batch_size}
  # Note: batch_size and eval_batch_size are **per machine**
  batch_size: ${div_up:${.global_batch_size}, ${eval:${trainer.devices} * ${trainer.num_nodes}}}
  eval_batch_size: ${div_up:${.eval_global_batch_size}, ${eval:${trainer.devices} * ${trainer.num_nodes}}}
  num_workers: ${eval:"len(__import__('os').sched_getaffinity(0))"}
  pin_memory: True

sampling:
  predictor: ancestral_cache
  steps: 1000
  temperature: 1.0
  noise_removal: ancestral  # 'ancestral', 'greedy', 'none'
  use_float64: True
  p_nucleus: 1.0
  num_sample_batches: 2  # Total samples: `num_gpus` * `loader.eval_batch_size` * num_sample_batches
  semi_ar: False
  stride_length: 1
  num_strides: 1

training:
  ema: 0.9999
  antithetic_sampling: True
  sampling_eps: 1e-3
  loss_precision: 'bf16'  # bf16, float32, float64

eval:
  checkpoint_path: kuleshov-group/mdlm-owt  # HF model, local checkpoint, or hf://owner/repo/file.ckpt.
  pretrained_path: null  # optional HF backbone override for a local checkpoint
  tokenizer_path: null  # optional tokenizer override when loading a checkpoint
  disable_ema: False
  compute_generative_perplexity: False
  perplexity_batch_size: 8
  compute_perplexity_on_sanity: False
  gen_ppl_eval_model_name_or_path: gpt2-large  # gpt2-large, meta-llama/Llama-2-7b-hf
  generate_samples: True
  generated_samples_path: ${cwd:}/samples.json
  num_samples: 1000  # exact samples per temperature/step/seed for standalone OWT sweeps

  owt_pareto_temp_every_n_validations: 0  # 0 disables the sweep
  owt_pareto_steps: []  # Set in the training script.
  pareto_temperatures: []
  owt_pareto_seeds: 1
  owt_pareto_num_batches: 0  # 0 uses sampling.num_sample_batches per rank

  gsm8k_at_validation: False
  validate_before_train: False
  gsm8k_every_n_validations: 1
  gsm8k_data_path: null  # optional local JSON; download GSM8K if no default file exists
  gsm8k_num_examples: null  # all questions
  gsm8k_batch_size: 16
  gsm8k_pareto_thresholds: []  # Set in the training script.
  gsm8k_pareto_temperature: 0.0
  gsm8k_max_steps: null  # sequence length
  tinygsm_exec_timeout: 5.0
  gsm8k_grading_workers: 4

optim:
  weight_decay: 0
  lr: 3e-4
  beta1: 0.9
  beta2: 0.999
  eps: 1e-8

trainer:
  _target_: lightning.Trainer
  accelerator: cuda
  num_nodes: 1
  devices: ${device_count:}
  accumulate_grad_batches: ${div_up:${loader.global_batch_size}, ${eval:${trainer.devices} * ${loader.batch_size} * ${trainer.num_nodes}}}
  gradient_clip_val: 1.0
  precision: 'bf16'
  num_sanity_val_steps: 2
  max_steps: 1_000_000  # Global batches (optimizer steps).
  log_every_n_steps: 100  # Global batches (optimizer steps).
  limit_train_batches: 1.0   # train on full dataset, can be used to toggle quick run
  limit_val_batches: 1.0     # validate on full dataset, can be used to toggle quick run
  val_check_interval: 5000  # Global batches (optimizer steps); positive integer.

hydra:
  run:
    dir: ./outputs/${data.train}/${now:%Y.%m.%d}/${now:%H%M%S}
  job:
    chdir: true

checkpointing:
  # Use custom `save_dir` if, e.g., saving to S3 bucket, otherwise leave this parameter as is
  save_dir: ${cwd:}
  # Note: `checkpoints` path should correspond to `checkpoint_every_n_steps.dirpath`
  resume_from_ckpt: true
  resume_ckpt_path: ${.save_dir}/checkpoints/last.ckpt
  use_periodic_checkpoint: false  # Save numbered checkpoints by global batch (optimizer step).
